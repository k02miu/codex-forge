name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node plugins/codex-forge/scripts/validate.mjs
      - run: bash -n plugins/codex-forge/scripts/diff-summary.sh
